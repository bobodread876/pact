# pact-stack — one-command sovereign self-host.
#
#   cp .env.example .env        # optional: set PACT_NWC, PACT_VERIFY_PRICE_SATS
#   docker compose up -d
#   curl -s localhost:8787/healthz
#
# Pulls the published multi-arch pactd image + runs your OWN Nostr relay. pactd
# defaults its relays to the bundled relay (PACT_RELAYS=ws://relay:7777), so your
# bonds can live entirely on your box. pactd is exposed on host loopback only.
#
# The container binds 0.0.0.0, so with PACT_TOKEN empty pactd generates an
# access token on first boot. Read it with:
#   docker compose exec pactd cat /data/.pact/token
# and unlock the UI with it (or open http://localhost:8787/#token=<token>).
#
# To build pactd from source instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: pact-stack

services:
  relay:
    image: ghcr.io/bobodread876/pact-relay:latest
    restart: unless-stopped
    volumes:
      - relay-data:/data
    # internal only — reachable by pactd on the compose network as `relay`

  pactd:
    # Pinned to the pactd release this compose was written for (CI checks it
    # matches packages/pactd/package.json). Never :latest — it drifts.
    image: ghcr.io/bobodread876/pactd:0.20.1
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      PACT_HOST: 0.0.0.0
      PACT_PORT: "8787"
      # A relay set saved from the UI (relays.json) takes precedence over this.
      PACT_RELAYS: ${PACT_RELAYS:-ws://relay:7777}
      PACT_NWC: ${PACT_NWC:-}
      PACT_VERIFY_PRICE_SATS: ${PACT_VERIFY_PRICE_SATS:-0}
      PACT_TOKEN: ${PACT_TOKEN:-}
      # Discovery is OPT-IN. Leave these empty and the node is invisible on the
      # open board until you publish an intent (UI "Become findable", or
      # POST /intent). Set PACT_INTENT_SEEKING (comma-separated bond kinds, e.g.
      # "collaboration,companion") to publish one as soon as an identity exists.
      PACT_INTENT_SEEKING: ${PACT_INTENT_SEEKING:-}
      PACT_INTENT_ABOUT: ${PACT_INTENT_ABOUT:-}
    ports:
      - "127.0.0.1:${PACT_HOST_PORT:-8787}:8787"
    volumes:
      - pact-data:/data

volumes:
  relay-data:
  pact-data:
